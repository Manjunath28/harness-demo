pipeline:
  identifier: Build_Manjunath28_harness_demo_1780865310852
  name: Build harness-demo
  orgIdentifier: default
  projectIdentifier: Harnessdemo
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: account.Github
        repoName: Manjunath28/harness-demo
  stages:
    - stage:
        identifier: build
        name: build
        spec:
          caching:
            enabled: true
          cloneCodebase: true
          execution:
            steps:
              - step:
                  identifier: echo
                  name: echo
                  spec:
                    command: echo hello world
                  timeout: ""
                  type: Run
              - step:
                  type: Run
                  name: Run
                  identifier: Run
                  spec:
                    shell: Sh
                    command: |-
                      cd app
                      npm ci
                  description: install dependency
              - step:
                  type: Run
                  name: Run_Tests
                  identifier: Run_Tests
                  spec:
                    shell: Sh
                    command: |-
                      cd app
                      npm test
              - step:
                  type: BuildAndPushDockerRegistry
                  name: BuildAndPushDockerRegistry_1
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: Manjunathpersonal
                    repo: pes2ug19cs219/harness-test
                    tags:
                      - <+pipeline.sequenceId>
                      - <+codebase.commitSha>
                    dockerfile: app/Dockerfile
                    context: app
          platform:
            arch: Amd64
            os: Linux
          runtime:
            spec: {}
            type: Cloud
        type: CI
    - stage:
        name: Sec-scan
        identifier: Secscan
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: container-scan
                  identifier: containerscan
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          # Install Trivy scanner
                          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

                          # Security Gate: FAIL on CRITICAL vulnerabilities
                          echo "=== Running Container Security Scan ==="
                          trivy image --exit-code 1 --severity CRITICAL --no-progress pes2ug19cs219/harness-test:<+pipeline.sequenceId>

                          # Full vulnerability report (HIGH + CRITICAL)
                          echo "=== Full Vulnerability Report ==="
                          trivy image --severity HIGH,CRITICAL --no-progress pes2ug19cs219/harness-test:<+pipeline.sequenceId>
                    environmentVariables: []
                    outputVariables: []
                  timeout: 30s
        tags: {}
